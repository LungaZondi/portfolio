<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunga Zondi — Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============ TOKENS — black, white, grayscale only ============ */
  :root{
    --bg-0:#ffffff;
    --ink:#0b0b0c;
    --ink-soft:#3a3b40;
    --text-0:#111113;
    --text-1:#5b5d64;
    --text-2:#9a9ba1;
    --glass-fill: rgba(255,255,255,.62);
    --glass-fill-strong: rgba(255,255,255,.85);
    --glass-fill-soft: rgba(0,0,0,.025);
    --glass-border: rgba(0,0,0,.09);
    --glass-border-strong: rgba(0,0,0,.22);
    --shadow-sm: 0 2px 10px rgba(0,0,0,.04);
    --shadow-md: 0 14px 40px rgba(0,0,0,.07), 0 2px 8px rgba(0,0,0,.04);
    --shadow-lg: 0 22px 60px rgba(0,0,0,.10);
    --r-xl:30px;
    --r-lg:22px;
    --r-md:16px;
    --r-sm:11px;
    --ease:cubic-bezier(.22,1,.36,1);
    --ease-out:cubic-bezier(.16,1,.3,1);
    --font-display:'Fraunces',Georgia,serif;
    --font-body:'Inter',system-ui,sans-serif;
    --font-mono:'Inter',system-ui,sans-serif;
    --label:600 10.5px/1 'Inter',system-ui,sans-serif;
    --sp-1:10px; --sp-2:18px; --sp-3:28px; --sp-4:40px; --sp-5:56px;
  }

  *{box-sizing:border-box;}
  html{-webkit-font-smoothing:antialiased;}
  body{
    margin:0; min-height:100vh; background:var(--bg-0); color:var(--text-0);
    font-family:var(--font-body); overflow-x:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important;}
  }

  /* ============ CUBE FIELD BACKGROUND (generative, loops like faint video) ============ */
  .cube-stage{position:fixed; inset:-6%; z-index:0; pointer-events:none; overflow:hidden;}
  .cube-field{
    position:absolute; inset:0; display:grid; place-items:center;
    grid-template-columns:repeat(var(--cols,8),1fr); grid-template-rows:repeat(var(--rows,5),1fr);
    perspective:1000px; opacity:.24;
  }
  .cube{width:38px; height:38px; position:relative; transform-style:preserve-3d; animation:cubeSync 10s linear infinite;}
  .cube .face{position:absolute; inset:0; border:1px solid rgba(10,10,12,.55); background:rgba(10,10,12,.03);}
  .cube .f-front{transform:translateZ(19px);}
  .cube .f-back{transform:translateZ(-19px) rotateY(180deg);}
  .cube .f-right{transform:rotateY(90deg) translateZ(19px);}
  .cube .f-left{transform:rotateY(-90deg) translateZ(19px);}
  .cube .f-top{transform:rotateX(90deg) translateZ(19px);}
  .cube .f-bottom{transform:rotateX(-90deg) translateZ(19px);}
  @keyframes cubeSync{
    0%{transform:rotateX(0deg) rotateY(0deg);}
    50%{transform:rotateX(180deg) rotateY(90deg);}
    100%{transform:rotateX(360deg) rotateY(180deg);}
  }
  .bg-veil{position:fixed; inset:0; z-index:0; background:radial-gradient(ellipse 70% 50% at 50% 8%, rgba(255,255,255,.75), rgba(255,255,255,0) 68%); pointer-events:none;}
  @media (max-width:720px){ .cube{width:28px;height:28px;} .cube .f-front,.cube .f-back{transform:translateZ(14px);} }

  /* ============ SHELL / CHROME BAR ============ */
  .shell{position:relative; z-index:1; max-width:1400px; margin:0 auto; padding:36px clamp(20px,4vw,44px) 110px;}

  .chrome{
    display:flex; align-items:center; gap:14px;
    background:var(--glass-fill); border:1px solid var(--glass-border);
    backdrop-filter:blur(20px) saturate(140%); -webkit-backdrop-filter:blur(20px) saturate(140%);
    border-radius:999px; padding:12px 20px; margin-bottom:24px; box-shadow:var(--shadow-sm);
    opacity:0; transform:translateY(-14px);
  }
  .dots{display:flex; gap:6px; flex-shrink:0;}
  .dots span{width:9px;height:9px;border-radius:50%; background:var(--text-2); opacity:.7;}
  .chrome-url{
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    background:rgba(0,0,0,.03); border:1px solid var(--glass-border);
    border-radius:999px; padding:6px 14px; color:var(--text-1); font-size:12.5px; font-family:var(--font-mono);
    min-width:0;
  }
  .chrome-url svg{flex-shrink:0; opacity:.6;}
  .chrome-url span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  @media (max-width:720px){ .dots{display:none;} }

  /* ============ ADMIN BAR ============ */
  .admin-bar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--ink); color:#fff; border-radius:16px; padding:12px 18px; margin-bottom:24px;
    max-height:0; opacity:0; overflow:hidden; transform:translateY(-8px);
    transition:max-height .5s var(--ease), opacity .4s var(--ease), transform .4s var(--ease), padding .5s var(--ease), margin .5s var(--ease);
  }
  .admin-bar.open{max-height:80px; opacity:1; transform:translateY(0);}
  .admin-bar .tag{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; letter-spacing:.3px; text-transform:uppercase; font-family:var(--font-mono);}
  .admin-bar .tag svg{color:#fff;}
  .admin-bar .spacer{flex:1;}
  .abtn{
    display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.12); color:#fff;
    border:1px solid rgba(255,255,255,.2); font-size:12.5px; font-weight:600; padding:8px 13px; border-radius:999px;
    cursor:pointer; transition:background .25s var(--ease), transform .2s var(--ease);
  }
  .abtn:hover{background:rgba(255,255,255,.22); transform:translateY(-1px);}
  .abtn.danger{background:rgba(255,255,255,.06);}

  /* ============ MAIN PANEL ============ */
  .app{display:grid; grid-template-columns:84px 1fr; gap:22px;}

  .sidebar{
    background:var(--glass-fill); border:1px solid var(--glass-border);
    backdrop-filter:blur(24px) saturate(140%); -webkit-backdrop-filter:blur(24px) saturate(140%);
    border-radius:var(--r-xl); box-shadow:var(--shadow-md);
    display:flex; flex-direction:column; align-items:center; padding:32px 0; gap:10px;
    opacity:0; transform:translateX(-16px);
    position:relative; z-index:5;
  }
  .sb-logo{
    width:40px;height:40px;border-radius:12px; margin-bottom:28px; flex-shrink:0;
    background:linear-gradient(135deg,#151517,#3a3b40);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:600; font-size:14px; color:#fff; letter-spacing:.2px;
  }
  .sb-btn{
    width:46px;height:46px; border-radius:14px; border:none; background:transparent; color:var(--text-1);
    display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative;
    transition:background .3s var(--ease), color .3s var(--ease), transform .25s var(--ease);
  }
  .sb-btn:hover{background:rgba(0,0,0,.05); color:var(--text-0); transform:translateY(-1px);}
  .sb-btn:active{transform:translateY(0) scale(.94);}
  .sb-btn.active{background:rgba(0,0,0,.06); color:var(--text-0);}
  .sb-btn.active::before{
    content:""; position:absolute; left:-16px; top:50%; translate:0 -50%;
    width:3px; height:18px; border-radius:3px; background:var(--ink);
  }
  .sb-btn.starred.on svg{fill:var(--ink); color:var(--ink);}
  .sb-btn.admin-on{background:var(--ink); color:#fff;}
  .sb-spacer{flex:1;}
  .sb-btn[data-tip]::after{
    content:attr(data-tip); position:absolute; left:58px; top:50%; translate:0 -50%;
    background:var(--ink); color:#fff; font-size:12px; padding:6px 10px; border-radius:8px; white-space:nowrap;
    opacity:0; pointer-events:none; transition:opacity .2s var(--ease), translate .2s var(--ease);
    box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:40;
  }
  .sb-btn[data-tip]:hover::after{opacity:1; translate:6px -50%;}

  .panel{
    background:var(--glass-fill); border:1px solid var(--glass-border);
    backdrop-filter:blur(28px) saturate(150%); -webkit-backdrop-filter:blur(28px) saturate(150%);
    border-radius:var(--r-xl); box-shadow:var(--shadow-lg);
    padding:clamp(28px,3.4vw,52px) clamp(26px,3.6vw,56px) clamp(34px,4vw,64px); min-width:0;
    opacity:0; transform:translateY(14px);
    position:relative; z-index:1;
  }

  /* ============ HEADER ============ */
  .panel-header{display:flex; align-items:center; gap:22px; flex-wrap:wrap; padding-bottom:36px;}
  .search-wrap{
    display:flex; align-items:center; gap:8px; background:rgba(0,0,0,.03);
    border:1px solid var(--glass-border); border-radius:999px; padding:9px 14px 9px 12px;
    width:210px; transition:width .35s var(--ease), border-color .3s var(--ease), background .3s var(--ease);
    flex-shrink:0;
  }
  .search-wrap:focus-within{width:270px; border-color:var(--glass-border-strong); background:rgba(0,0,0,.045);}
  .search-wrap svg{flex-shrink:0; color:var(--text-2);}
  .search-wrap input{background:none; border:none; outline:none; color:var(--text-0); font-size:13.5px; font-family:var(--font-body); width:100%;}
  .search-wrap input::placeholder{color:var(--text-2);}

  .tabs{display:flex; gap:4px; background:rgba(0,0,0,.025); border:1px solid var(--glass-border); border-radius:999px; padding:4px; overflow-x:auto; scrollbar-width:none; flex:1 1 200px; min-width:0;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{border:none; background:none; color:var(--text-1); font-family:var(--font-body); font-weight:500; font-size:13px; padding:8px 15px; border-radius:999px; cursor:pointer; white-space:nowrap; position:relative; transition:color .3s var(--ease);}
  .tab.active{color:#fff;}
  .tab .tab-pill{position:absolute; inset:0; border-radius:999px; z-index:-1; background:var(--ink); opacity:0; transform:scale(.9); transition:opacity .35s var(--ease), transform .35s var(--ease);}
  .tab.active .tab-pill{opacity:1; transform:scale(1);}

  .header-right{display:flex; align-items:center; gap:12px; margin-left:auto;}
  .who{display:flex; align-items:center; gap:11px; cursor:pointer; padding:6px 14px 6px 6px; border-radius:999px; border:1px solid transparent; transition:background .3s var(--ease), border-color .3s var(--ease);}
  .who:hover, .who:focus-visible{background:rgba(0,0,0,.035); border-color:var(--glass-border);}
  .who-ava{width:36px;height:36px;border-radius:50%; flex-shrink:0; background:linear-gradient(145deg,#1a1a1c,#4a4b52); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:600; font-size:13px; color:#fff;}
  .who-txt{display:flex; flex-direction:column; line-height:1.3;}
  .who-txt b{font-size:13.5px; font-weight:600; font-family:var(--font-display);}
  .who-txt span{font-size:11px; color:var(--text-2); letter-spacing:.2px;}
  @media (max-width:600px){ .who-txt{display:none;} }

  /* ============ CONTENT GRID ============ */
  .content{display:grid; grid-template-columns:300px 1fr; gap:32px; align-items:start;}

  .block{background:var(--glass-fill-soft); border:1px solid var(--glass-border); border-radius:var(--r-lg); padding:26px 22px;}
  .block + .block{margin-top:24px;}
  .block-head{display:flex; align-items:center; gap:8px; margin-bottom:18px;}
  .block-head h3{font-family:var(--font-display); font-size:16px; font-weight:600; margin:0; letter-spacing:.1px;}
  .block-head .hint{margin-left:auto; font-size:11.5px; color:var(--text-2); display:flex; align-items:center; gap:4px; cursor:pointer; transition:color .25s;}
  .block-head .hint:hover{color:var(--text-0);}

  .mini-empty{font-size:12.5px; color:var(--text-2); padding:18px 6px; text-align:center; border:1px dashed var(--glass-border-strong); border-radius:12px;}

  .row-item{display:flex; align-items:center; gap:13px; padding:11px 9px; border-radius:12px; cursor:pointer; transition:background .28s var(--ease), transform .28s var(--ease);}
  .row-item + .row-item{margin-top:2px;}
  .row-item:hover{background:rgba(0,0,0,.045); transform:translateX(2px);}
  .row-thumb{width:44px;height:44px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; background:rgba(0,0,0,.04);}
  .row-thumb svg{position:relative; z-index:1;}
  .row-info{min-width:0; flex:1;}
  .row-info .t{font-size:12.8px; font-weight:600; color:var(--text-0); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row-info .m{font-size:11px; color:var(--text-2); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row-chev{color:var(--text-2); flex-shrink:0; transition:transform .28s var(--ease);}
  .row-item:hover .row-chev{transform:translateX(3px); color:var(--text-0);}

  .prog-bar{height:4px; border-radius:3px; background:rgba(0,0,0,.08); margin-top:6px; overflow:hidden;}
  .prog-fill{height:100%; border-radius:3px; background:var(--ink); transform-origin:left; transform:scaleX(0); transition:transform 1.1s var(--ease-out);}

  /* ============ HERO ============ */
  .hero{position:relative; border-radius:var(--r-lg); overflow:hidden; min-height:400px; border:1px solid var(--glass-border); background:linear-gradient(150deg, rgba(0,0,0,.035), rgba(0,0,0,.01));}
  .hero-slide{position:absolute; inset:0; display:grid; grid-template-columns:1.15fr .85fr; align-items:center; gap:20px; padding:52px 56px; opacity:0; visibility:hidden; transform:translateX(24px) scale(.99); transition:opacity .6s var(--ease), transform .6s var(--ease), visibility 0s linear .6s;}
  .hero-slide.active{position:relative; opacity:1; visibility:visible; transform:translateX(0) scale(1); transition:opacity .6s var(--ease), transform .6s var(--ease);}
  .hero-eyebrow{display:flex; align-items:center; gap:8px; color:var(--text-1); font-size:12.5px; font-weight:500; letter-spacing:.3px; font-style:italic; font-family:var(--font-display);}
  .hero-eyebrow svg{animation:sparkle 2.4s ease-in-out infinite;}
  @keyframes sparkle{0%,100%{transform:scale(1) rotate(0);}50%{transform:scale(1.15) rotate(12deg);}}
  .hero-tags{display:flex; gap:8px; margin:20px 0 18px; flex-wrap:wrap;}
  .htag{font-size:11.5px; font-weight:600; padding:6px 13px; border-radius:999px; border:1px solid var(--glass-border-strong); color:var(--text-1); background:rgba(0,0,0,.03);}
  .htag.solid{background:var(--ink); color:#fff; border-color:var(--ink);}
  .hero-title{font-family:var(--font-display); font-size:clamp(28px,3.6vw,42px); font-weight:600; line-height:1.1; margin:0 0 18px; letter-spacing:-.3px;}
  .hero-desc{color:var(--text-1); font-size:15px; line-height:1.7; max-width:44ch; margin:0 0 28px;}
  .hero-meta{display:flex; gap:22px; margin-bottom:30px; font-size:11.5px; color:var(--text-2); font-family:var(--font-mono); letter-spacing:.2px;}
  .hero-meta b{color:var(--text-1); font-weight:500;}
  .hero-actions{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .btn{display:inline-flex; align-items:center; gap:8px; font-family:var(--font-body); font-weight:600; font-size:13.5px; padding:12px 22px; border-radius:999px; border:none; cursor:pointer; transition:transform .25s var(--ease), box-shadow .25s var(--ease), background .25s var(--ease);}
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:hover{transform:translateY(-2px); box-shadow:0 10px 26px rgba(0,0,0,.22);}
  .btn-ghost{background:rgba(0,0,0,.03); color:var(--text-0); border:1px solid var(--glass-border-strong);}
  .btn-ghost:hover{background:rgba(0,0,0,.07); transform:translateY(-2px);}
  .btn:active{transform:translateY(0) scale(.97);}
  .btn-sm{padding:7px 14px; font-size:12.5px;}

  .hero-art{position:relative; height:100%; display:flex; align-items:center; justify-content:center; border-radius:18px; overflow:hidden;}
  .hero-art svg{width:100%; height:auto; max-height:230px;}
  .hero-empty{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:12px; padding:40px; height:100%; min-height:300px;}
  .hero-empty svg{opacity:.35;}
  .hero-empty b{font-family:var(--font-display); font-size:17px;}
  .hero-empty span{font-size:13px; color:var(--text-2); max-width:34ch;}

  .hero-nav{position:absolute; right:24px; bottom:22px; display:flex; align-items:center; gap:10px; z-index:5;}
  .hero-dots{display:flex; gap:6px; margin-right:4px;}
  .hdot{width:6px;height:6px;border-radius:50%; background:rgba(0,0,0,.18); cursor:pointer; transition:all .35s var(--ease); border:none; padding:0;}
  .hdot.active{width:20px; border-radius:4px; background:var(--ink);}
  .harrow{width:36px;height:36px; border-radius:50%; border:1px solid var(--glass-border-strong); background:rgba(255,255,255,.7); backdrop-filter:blur(8px); color:var(--text-0); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background .25s var(--ease), transform .2s var(--ease);}
  .harrow:hover{background:#fff; transform:translateY(-1px);}

  @media (max-width:860px){ .hero-slide{grid-template-columns:1fr; padding:26px;} .hero-art{display:none;} }

  /* ============ PROJECT GRID ============ */
  .project-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:24px;}
  .card{background:var(--glass-fill-soft); border:1px solid var(--glass-border); border-radius:var(--r-md); padding:20px; cursor:pointer; position:relative; overflow:hidden; opacity:0; transform:translateY(18px); transition:transform .45s var(--ease), border-color .35s var(--ease), background .35s var(--ease), box-shadow .35s var(--ease), opacity .5s var(--ease);}
  .card.in-view{opacity:1; transform:translateY(0);}
  .card:hover{transform:translateY(-5px); border-color:var(--glass-border-strong); background:rgba(0,0,0,.03); box-shadow:var(--shadow-md);}
  .card:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
  .card.hide{display:none;}
  .card-art{height:126px; border-radius:12px; display:flex; align-items:center; justify-content:center; margin-bottom:18px; position:relative; overflow:hidden; background:rgba(0,0,0,.03);}
  .card-art svg{position:relative; z-index:1; transition:transform .5s var(--ease);}
  .card:hover .card-art svg{transform:scale(1.06) translateY(-2px);}
  .card-badge{position:absolute; top:10px; left:10px; font-size:10px; font-weight:600; letter-spacing:.3px; padding:5px 11px; border-radius:999px; z-index:2; font-family:var(--font-mono); background:rgba(255,255,255,.8); color:var(--ink); border:1px solid rgba(0,0,0,.08); backdrop-filter:blur(6px);}
  .card-play{position:absolute; bottom:10px; right:10px; width:26px;height:26px; border-radius:50%; background:rgba(255,255,255,.85); display:flex; align-items:center; justify-content:center; z-index:2; color:var(--ink); opacity:0; transform:scale(.7); transition:opacity .3s var(--ease), transform .3s var(--ease);}
  .card:hover .card-play{opacity:1; transform:scale(1);}
  .card-title{font-family:var(--font-display); font-weight:600; font-size:16px; margin:0 0 7px; line-height:1.3;}
  .card.has-admin .card-title{padding-right:44px;}
  .card-desc{font-size:12.5px; color:var(--text-1); line-height:1.6; margin:0 0 14px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .card-tags{display:flex; gap:6px; flex-wrap:wrap;}
  .ctag{font-size:10px; color:var(--text-2); background:rgba(0,0,0,.03); border:1px solid var(--glass-border); padding:4px 9px; border-radius:999px; font-family:var(--font-mono);}

  .card-admin-ctrls{position:absolute; top:10px; right:10px; z-index:5; display:flex; gap:5px; opacity:0; transform:translateY(-4px); transition:opacity .25s var(--ease), transform .25s var(--ease);}
  .card:hover .card-admin-ctrls, .card:focus-within .card-admin-ctrls{opacity:1; transform:translateY(0);}
  .ic-btn{width:26px;height:26px; border-radius:50%; border:1px solid rgba(255,255,255,.4); background:rgba(20,20,22,.75); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; backdrop-filter:blur(4px); transition:background .2s var(--ease), transform .2s var(--ease);}
  .ic-btn:hover{background:#000; transform:scale(1.08);}

  .card-add{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; border:1.5px dashed var(--glass-border-strong); background:transparent; min-height:240px; color:var(--text-2); transition:background .3s var(--ease), color .3s var(--ease), border-color .3s var(--ease);}
  .card-add:hover{background:rgba(0,0,0,.025); color:var(--text-0); border-color:var(--ink);}
  .card-add svg{opacity:.6;}
  .card-add span{font-size:12.5px; font-weight:600; font-family:var(--font-display);}

  @media (max-width:980px){ .project-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:860px){
    .content{grid-template-columns:1fr;}
    .app{grid-template-columns:1fr; grid-template-rows:auto 1fr;}
    .sidebar{flex-direction:row; width:100%; padding:12px 16px; gap:2px; overflow-x:auto; justify-content:flex-start;}
    .sb-logo{margin-bottom:0; margin-right:10px;}
    .sb-spacer{display:none;}
    .sb-btn.active::before{left:50%; top:auto; bottom:-8px; translate:-50% 0; width:16px; height:3px;}
    .sb-btn[data-tip]::after{display:none;}
    .shell{padding:20px 16px 70px;}
  }
  @media (max-width:540px){ .project-grid{grid-template-columns:1fr;} .search-wrap{width:100%;} }

  /* ============ EMPTY STATE ============ */
  .empty{display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:50px 20px; color:var(--text-2); grid-column:1/-1;}
  .empty.show{display:flex;}
  .empty svg{margin-bottom:12px; opacity:.5;}
  .empty b{color:var(--text-1); font-size:14px; display:block; margin-bottom:4px;}
  .empty span{font-size:12.5px;}
  .empty .btn{margin-top:16px;}

  /* ============ MODAL ============ */
  .overlay{position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:24px; background:rgba(20,20,22,.28); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); opacity:0; pointer-events:none; transition:opacity .4s var(--ease);}
  .overlay.open{opacity:1; pointer-events:auto;}
  .modal{width:100%; max-width:580px; max-height:86vh; overflow-y:auto; background:#fff; border:1px solid var(--glass-border-strong); border-radius:28px; padding:36px; transform:scale(.92) translateY(18px); opacity:0; transition:transform .45s var(--ease), opacity .4s var(--ease); box-shadow:var(--shadow-lg);}
  .overlay.open .modal{transform:scale(1) translateY(0); opacity:1;}
  .modal-close{position:sticky; top:0; float:right; width:34px;height:34px; border-radius:50%; border:1px solid var(--glass-border); background:rgba(0,0,0,.03); color:var(--text-1); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background .25s, color .25s, transform .25s; margin-left:12px;}
  .modal-close:hover{background:var(--ink); color:#fff; transform:rotate(90deg);}
  .modal-art{height:150px; border-radius:16px; display:flex; align-items:center; justify-content:center; margin-bottom:22px; position:relative; overflow:hidden; background:rgba(0,0,0,.03);}
  .modal h2{font-family:var(--font-display); font-size:26px; font-weight:600; margin:0 0 8px; line-height:1.2;}
  .modal-meta{display:flex; gap:16px; flex-wrap:wrap; font-size:11.5px; color:var(--text-2); font-family:var(--font-mono); margin-bottom:20px;}
  .modal-meta b{color:var(--text-1); font-weight:500;}
  .modal p.desc{color:var(--text-1); font-size:14.5px; line-height:1.75; margin:0 0 24px;}
  .modal-h4{font-family:var(--font-display); font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:.4px; color:var(--text-2); margin:0 0 12px;}
  .modal ul.highlights{list-style:none; margin:0 0 26px; padding:0; display:flex; flex-direction:column; gap:11px;}
  .modal ul.highlights li{display:flex; gap:10px; font-size:13.5px; color:var(--text-1); line-height:1.6;}
  .modal ul.highlights li svg{flex-shrink:0; margin-top:2px; color:var(--ink);}
  .modal-tags{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:28px;}
  .modal-actions{display:flex; gap:10px; flex-wrap:wrap;}

  /* ---- form ---- */
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--text-1); margin-bottom:6px; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.3px;}
  .field input[type=text], .field input[type=number], .field input[type=url], .field select, .field textarea{
    width:100%; background:rgba(0,0,0,.025); border:1px solid var(--glass-border); border-radius:10px; padding:10px 12px;
    font-family:var(--font-body); font-size:13.5px; color:var(--text-0); outline:none; transition:border-color .25s var(--ease), background .25s var(--ease);
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--ink); background:rgba(0,0,0,.04);}
  .field textarea{resize:vertical; min-height:64px; font-family:var(--font-body);}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .field-check{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-1); cursor:pointer;}
  .field-check input{width:16px;height:16px; accent-color:var(--ink);}
  .img-preview{width:100%; height:110px; border-radius:12px; background:rgba(0,0,0,.03); border:1px dashed var(--glass-border-strong); display:flex; align-items:center; justify-content:center; overflow:hidden; margin-bottom:8px; color:var(--text-2); font-size:12px;}
  .img-preview img{width:100%; height:100%; object-fit:cover;}
  .field small{display:block; color:var(--text-2); font-size:11px; margin-top:5px; line-height:1.5;}

  /* ============ ENTRANCE ANIMS ============ */
  body.loaded .chrome{opacity:1; transform:translateY(0); transition:opacity .7s var(--ease-out), transform .7s var(--ease-out);}
  body.loaded .sidebar{opacity:1; transform:translateX(0); transition:opacity .7s .08s var(--ease-out), transform .7s .08s var(--ease-out);}
  body.loaded .panel{opacity:1; transform:translateY(0); transition:opacity .7s .14s var(--ease-out), transform .7s .14s var(--ease-out);}

  ::selection{background:var(--ink); color:#fff;}
  a{color:inherit;}
</style>
</head>
<body>

          <input id="searchInput" type="text" placeholder="Search projects" autocomplete="off">

        <nav class="tabs" id="tabs" role="tablist" aria-label="Project categories">

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>

<script>
/* ============================================================
   DATA MODEL
   Projects live in localStorage while you (the admin) are
   editing, and are published to visitors via projects.json.
   Nothing is hard-coded — the site starts empty.
   ============================================================ */
let PROJECTS = [];
const STORAGE_KEY = 'lz_projects';
const ADMIN_KEY = 'lz_admin';
const ADMIN_PASSCODE = 'lunga-admin'; // change this before publishing

const CAT = {
  web:  {label:'Website'},
  dash: {label:'Dashboard'},
  excel:{label:'Excel'},
  auto: {label:'Automation'}
};

let adminMode = localStorage.getItem(ADMIN_KEY) === '1';

/* ---------- cube background ---------- */
(function buildCubeField(){
  const field = document.getElementById('cubeField');
  const narrow = window.innerWidth < 720;
  const cols = narrow ? 5 : 8, rows = narrow ? 7 : 5;
  field.style.setProperty('--cols', cols);
  field.style.setProperty('--rows', rows);
  let html = '';
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const delay = ((r+c) % 7) * 0.32;
      html += `<div class="cube" style="animation-delay:${delay}s">
        <div class="face f-front"></div><div class="face f-back"></div>
        <div class="face f-left"></div><div class="face f-right"></div>
        <div class="face f-top"></div><div class="face f-bottom"></div>
      </div>`;
    }
  }
  field.innerHTML = html;
})();
/* To use your own looping video instead of the generated cubes,
   replace the .cube-stage div's content with:
   <video autoplay muted loop playsinline style="width:100%;height:100%;object-fit:cover;opacity:.14;">
     <source src="your-video.mp4" type="video/mp4">
   </video> */

/* ---------- persistence ---------- */
function saveLocal(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(PROJECTS)); }

function loadProjects(){
  const local = localStorage.getItem(STORAGE_KEY);
  if(local){
    try{ PROJECTS = JSON.parse(local) || []; renderAll(); return; }catch(e){}
  }
  fetch('projects.json', {cache:'no-store'})
    .then(r => r.ok ? r.json() : [])
    .then(data => { PROJECTS = Array.isArray(data) ? data : []; renderAll(); })
    .catch(() => { PROJECTS = []; renderAll(); });
}

/* ---------- icon artwork per category (monochrome) ---------- */
function artSVG(cat, size){
  const c = 'rgba(10,10,12,.82)';
  if(cat==='web'){
    return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" fill="none">
      <rect x="6" y="10" width="52" height="40" rx="6" fill="${c}" fill-opacity=".06" stroke="${c}" stroke-width="1.6"/>
      <path d="M6 20h52" stroke="${c}" stroke-width="1.6"/>
      <circle cx="13" cy="15" r="1.6" fill="${c}"/><circle cx="18" cy="15" r="1.6" fill="${c}"/><circle cx="23" cy="15" r="1.6" fill="${c}"/>
      <rect x="13" y="27" width="18" height="4" rx="2" fill="${c}" fill-opacity=".55"/>
      <rect x="13" y="34" width="30" height="3" rx="1.5" fill="${c}" fill-opacity=".25"/>
      <rect x="13" y="40" width="24" height="3" rx="1.5" fill="${c}" fill-opacity=".25"/>
    </svg>`;
  }
  if(cat==='dash'){
    return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" fill="none">
      <rect x="8" y="9" width="48" height="46" rx="7" fill="${c}" fill-opacity=".05" stroke="${c}" stroke-width="1.6"/>
      <rect x="16" y="36" width="6" height="12" rx="1.5" fill="${c}" fill-opacity=".4"/>
      <rect x="26" y="28" width="6" height="20" rx="1.5" fill="${c}" fill-opacity=".6"/>
      <rect x="36" y="20" width="6" height="28" rx="1.5" fill="${c}" fill-opacity=".85"/>
      <path d="M15 22 L24 16 L33 19 L45 12" stroke="${c}" stroke-width="1.8" stroke-linecap="round" fill="none" opacity=".8"/>
    </svg>`;
  }
  if(cat==='excel'){
    return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" fill="none">
      <rect x="7" y="9" width="50" height="46" rx="6" fill="${c}" fill-opacity=".05" stroke="${c}" stroke-width="1.6"/>
      <path d="M7 22h50M7 33h50M7 44h50M20 9v46M33 9v46M46 9v46" stroke="${c}" stroke-opacity=".25" stroke-width="1.2"/>
      <rect x="20" y="22" width="13" height="11" fill="${c}" fill-opacity=".4"/>
    </svg>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" fill="none">
    <circle cx="16" cy="18" r="6" fill="${c}" fill-opacity=".08" stroke="${c}" stroke-width="1.6"/>
    <circle cx="48" cy="18" r="6" fill="${c}" fill-opacity=".08" stroke="${c}" stroke-width="1.6"/>
    <circle cx="32" cy="46" r="7" fill="${c}" fill-opacity=".14" stroke="${c}" stroke-width="1.6"/>
    <path d="M16 24v8a4 4 0 0 0 4 4h4M48 24v8a4 4 0 0 0-4 4h-4" stroke="${c}" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </svg>`;
}

function heroArtSVG(cat){
  const c = 'rgba(10,10,12,.8)';
  if(cat==='dash'){
    return `<svg viewBox="0 0 320 220" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="10" y="10" width="300" height="200" rx="20" fill="${c}" fill-opacity=".04" stroke="${c}" stroke-opacity=".22"/>
      <rect x="34" y="140" width="24" height="48" rx="4" fill="${c}" fill-opacity=".35"/>
      <rect x="70" y="110" width="24" height="78" rx="4" fill="${c}" fill-opacity=".55"/>
      <rect x="106" y="70" width="24" height="118" rx="4" fill="${c}" fill-opacity=".85"/>
      <rect x="142" y="95" width="24" height="93" rx="4" fill="${c}" fill-opacity=".55"/>
      <path d="M34 60 L80 40 L120 55 L170 25 L230 45" stroke="${c}" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      <circle cx="230" cy="45" r="4" fill="${c}"/><circle cx="170" cy="25" r="4" fill="${c}"/>
      <rect x="190" y="90" width="100" height="98" rx="12" fill="${c}" fill-opacity=".04" stroke="${c}" stroke-opacity=".2"/>
      <circle cx="240" cy="140" r="34" fill="none" stroke="${c}" stroke-width="10" stroke-dasharray="160" stroke-dashoffset="45" stroke-linecap="round" transform="rotate(-90 240 140)"/>
    </svg>`;
  }
  if(cat==='excel'){
    return `<svg viewBox="0 0 320 220" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="10" y="10" width="300" height="200" rx="20" fill="${c}" fill-opacity=".04" stroke="${c}" stroke-opacity=".22"/>
      <g stroke="${c}" stroke-opacity=".2"><path d="M10 60h300M10 100h300M10 140h300M10 180h300"/><path d="M80 10v200M150 10v200M220 10v200"/></g>
      <rect x="80" y="60" width="70" height="40" fill="${c}" fill-opacity=".4"/>
      <rect x="150" y="100" width="70" height="40" fill="${c}" fill-opacity=".2"/>
      <path d="M235 175 L255 140 L272 158 L296 115" stroke="${c}" stroke-width="3" stroke-linecap="round" fill="none"/>
    </svg>`;
  }
  if(cat==='auto'){
    return `<svg viewBox="0 0 320 220" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="10" y="10" width="300" height="200" rx="20" fill="${c}" fill-opacity=".04" stroke="${c}" stroke-opacity=".22"/>
      <circle cx="60" cy="60" r="20" fill="${c}" fill-opacity=".08" stroke="${c}" stroke-width="1.8"/>
      <circle cx="260" cy="60" r="20" fill="${c}" fill-opacity=".08" stroke="${c}" stroke-width="1.8"/>
      <circle cx="160" cy="160" r="26" fill="${c}" fill-opacity=".16" stroke="${c}" stroke-width="1.8"/>
      <path d="M60 80v30a10 10 0 0 0 10 10h60M260 80v30a10 10 0 0 1-10 10h-60" stroke="${c}" stroke-width="2" fill="none"/>
      <circle cx="160" cy="160" r="6" fill="${c}"/>
    </svg>`;
  }
  return `<svg viewBox="0 0 320 220" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="10" width="300" height="200" rx="20" fill="${c}" fill-opacity=".04" stroke="${c}" stroke-opacity=".22"/>
    <rect x="30" y="30" width="260" height="160" rx="12" fill="${c}" fill-opacity=".04" stroke="${c}" stroke-opacity=".25"/>
    <path d="M30 55h260" stroke="${c}" stroke-opacity=".25"/>
    <circle cx="45" cy="42" r="4" fill="${c}"/><circle cx="60" cy="42" r="4" fill="${c}"/><circle cx="75" cy="42" r="4" fill="${c}"/>
    <rect x="50" y="75" width="90" height="20" rx="4" fill="${c}" fill-opacity=".5"/>
    <rect x="50" y="105" width="160" height="10" rx="3" fill="${c}" fill-opacity=".2"/>
    <rect x="50" y="123" width="130" height="10" rx="3" fill="${c}" fill-opacity=".2"/>
    <rect x="50" y="150" width="60" height="24" rx="12" fill="${c}"/>
  </svg>`;
}

function mediaBlock(p, size){
  if(p.image) return `<img src="${p.image}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">`;
  return artSVG(p.category, size);
}

/* ---------- render: recent work ---------- */
const recentList = document.getElementById('recentList');
function renderRecent(){
  if(PROJECTS.length === 0){ recentList.innerHTML = `<div class="mini-empty">No projects yet.</div>`; return; }
  const items = [...PROJECTS].slice(0,4);
  recentList.innerHTML = items.map(p=>`
    <div class="row-item" data-id="${p.id}" tabindex="0" role="button" aria-label="Open ${p.title}">
      <div class="row-thumb">${mediaBlock(p,26)}</div>
      <div class="row-info"><div class="t">${p.title}</div><div class="m">${CAT[p.category].label} · ${p.year||''}</div></div>
      <svg class="row-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
    </div>`).join('');
}

/* ---------- render: in progress ---------- */
const progressList = document.getElementById('progressList');
function renderProgress(){
  const items = PROJECTS.filter(p=>p.inProgress);
  if(items.length === 0){ progressList.innerHTML = `<div class="mini-empty">Nothing in progress right now.</div>`; return; }
  progressList.innerHTML = items.map((p,i)=>`
    <div class="row-item" style="cursor:default;">
      <div class="row-thumb">${mediaBlock(p,26)}</div>
      <div class="row-info" style="flex:1;">
        <div class="t">${p.title}</div><div class="m">${CAT[p.category].label} · ${p.role||''}</div>
        <div class="prog-bar"><div class="prog-fill" id="pf${i}"></div></div>
      </div>
      <div class="m" style="flex-shrink:0; font-family:var(--font-mono); color:var(--text-1);">${p.progress||0}%</div>
    </div>`).join('');
  requestAnimationFrame(()=>{ setTimeout(()=>{
    items.forEach((p,i)=>{ const el=document.getElementById('pf'+i); if(el) el.style.transform = `scaleX(${(p.progress||0)/100})`; });
  }, 400); });
}

/* ---------- hero carousel ---------- */
const heroEl = document.getElementById('hero');
let heroIdx = 0, heroTimer;

function renderHero(){
  const featured = PROJECTS.filter(p=>p.featured);
  clearInterval(heroTimer);
  if(featured.length === 0){
    heroEl.innerHTML = `
      <div class="hero-empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2Z"/></svg>
        <b>Your featured work will show up here</b>
        <span>Mark a project as "Featured" from the admin panel to spotlight it in this hero.</span>
        ${adminMode ? `<button class="btn btn-primary btn-sm" id="heroAddBtn">+ Add a project</button>` : ''}
      </div>`;
    if(adminMode){ document.getElementById('heroAddBtn')?.addEventListener('click', ()=>openForm()); }
    return;
  }
  heroIdx = Math.min(heroIdx, featured.length-1);
  heroEl.innerHTML = featured.map((p,i)=>`
    <div class="hero-slide ${i===heroIdx?'active':''}" data-i="${i}">
      <div>
        <div class="hero-eyebrow">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2Z"/></svg>
          Featured Project
        </div>
        <div class="hero-tags">
          <span class="htag solid">${CAT[p.category].label}</span>
          ${(p.tags||[]).slice(0,2).map(t=>`<span class="htag">${t}</span>`).join('')}
        </div>
        <h1 class="hero-title">${p.title}</h1>
        <p class="hero-desc">${p.desc||''}</p>
        <div class="hero-meta"><span>Role · <b>${p.role||'—'}</b></span><span>Year · <b>${p.year||'—'}</b></span></div>
        <div class="hero-actions">
          ${p.link ? `<a class="btn btn-primary" href="${p.link}" target="_blank" rel="noopener"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>View live</a>` : ''}
          <button class="btn btn-ghost" data-action="detail" data-id="${p.id}">Case study</button>
        </div>
      </div>
      <div class="hero-art">${p.image ? `<img src="${p.image}" style="width:100%;height:100%;object-fit:cover;">` : heroArtSVG(p.category)}</div>
    </div>
  `).join('');

  const nav = document.createElement('div');
  nav.className = 'hero-nav';
  nav.innerHTML = `
    <div class="hero-dots">${featured.map((_,i)=>`<button class="hdot ${i===heroIdx?'active':''}" data-i="${i}" aria-label="Slide ${i+1}"></button>`).join('')}</div>
    <button class="harrow" id="heroPrev" aria-label="Previous"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="harrow" id="heroNext" aria-label="Next"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 18 6-6-6-6"/></svg></button>
  `;
  heroEl.appendChild(nav);

  heroEl.querySelectorAll('[data-action="detail"]').forEach(btn=>{
    btn.addEventListener('click', ()=>openModal(btn.dataset.id));
  });
  heroEl.querySelector('#heroPrev').addEventListener('click', ()=>gotoHero(heroIdx-1));
  heroEl.querySelector('#heroNext').addEventListener('click', ()=>gotoHero(heroIdx+1));
  heroEl.querySelectorAll('.hdot').forEach(d=>d.addEventListener('click', ()=>gotoHero(parseInt(d.dataset.i))));
  heroEl.addEventListener('mouseenter', ()=>clearInterval(heroTimer));
  heroEl.addEventListener('mouseleave', startHeroAuto);
  startHeroAuto();

  function gotoHero(i){
    const feat = PROJECTS.filter(p=>p.featured);
    heroIdx = (i + feat.length) % feat.length;
    heroEl.querySelectorAll('.hero-slide').forEach((s,idx)=>s.classList.toggle('active', idx===heroIdx));
    heroEl.querySelectorAll('.hdot').forEach((d,idx)=>d.classList.toggle('active', idx===heroIdx));
    clearInterval(heroTimer); startHeroAuto();
  }
  function startHeroAuto(){
    const feat = PROJECTS.filter(p=>p.featured);
    if(feat.length < 2) return;
    heroTimer = setInterval(()=>gotoHero(heroIdx+1), 6500);
  }
}

function addTileHTML(){
  return `
    <div class="card card-add" id="addTile" tabindex="0" role="button" aria-label="Add project">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>

function renderGrid(){
  const tiles = (adminMode ? addTileHTML() : '') + PROJECTS.map(cardHTML).join('');
  grid.innerHTML = tiles;
  if(adminMode){ document.getElementById('addTile').addEventListener('click', ()=>openForm()); }
  attachCardEvents();
  revealObserver();
  applyFilters();
}

function attachCardEvents(){
  grid.querySelectorAll('.card:not(.card-add)').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(e.target.closest('.edit-btn') || e.target.closest('.del-btn')) return;
      openModal(card.dataset.id);
    });
    card.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openModal(card.dataset.id);} });
  });
  grid.querySelectorAll('.edit-btn').forEach(b=>b.addEventListener('click', (e)=>{ e.stopPropagation(); openForm(b.dataset.id); }));
  grid.querySelectorAll('.del-btn').forEach(b=>b.addEventListener('click', (e)=>{ e.stopPropagation(); deleteProject(b.dataset.id); }));
}

function revealObserver(){
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in-view'); io.unobserve(en.target); } });
  }, {threshold:.15});
  grid.querySelectorAll('.card').forEach((c,i)=>{
    c.style.transitionDelay = (i%8 * 45)+'ms';
    io.observe(c);
  });
}

function applyFilters(){
  const q = currentQuery.trim().toLowerCase();
  let anyVisible = false;
  grid.querySelectorAll('.card:not(.card-add)').forEach(card=>{
    const p = PROJECTS.find(x=>x.id===card.dataset.id);
    if(!p) return;
    const matchesCat = currentCat==='all' || p.category===currentCat;
    const hay = [p.title, (p.tags||[]).join(' '), p.desc||''].join(' ').toLowerCase();
    const matchesQuery = !q || hay.includes(q);
    const matchesStar = !starredOnly || p.featured;
    const show = matchesCat && matchesQuery && matchesStar;
    card.classList.toggle('hide', !show);
    if(show) anyVisible = true;
  });
  updateEmptyState(anyVisible);
}

function updateEmptyState(anyVisible){
  if(PROJECTS.length === 0){
    emptyState.classList.add('show');
    emptyState.innerHTML = `
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2Z"/></svg>
      <b>Your portfolio is empty</b>
      <span>${adminMode ? 'Add your first project to get started.' : 'Check back soon — new work is on the way.'}</span>
      ${adminMode ? `<button class="btn btn-primary btn-sm" id="emptyAddBtn">+ Add project</button>` : ''}
    `;
    if(adminMode) document.getElementById('emptyAddBtn')?.addEventListener('click', ()=>openForm());
    return;
  }
  if(!anyVisible){
    emptyState.classList.add('show');
    emptyState.innerHTML = `
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <b>Nothing matches yet</b>
      <span>Try a different search term or category.</span>
    `;
    return;
  }
  emptyState.classList.remove('show');
}

      image: formImageData
    };
    if(existing){
      const idx = PROJECTS.findIndex(p=>p.id===existing.id);
      PROJECTS[idx] = data;
    } else {
      PROJECTS.unshift(data);
    }
    saveLocal();
    closeModal();
    renderAll();
  });
}

function deleteProject(id){
  const p = PROJECTS.find(x=>x.id===id);
  if(!p) return;
  if(!confirm(`Delete "${p.title}"? This can't be undone.`)) return;
  PROJECTS = PROJECTS.filter(x=>x.id!==id);
  saveLocal();
  renderAll();
}

function slugify(str){
  return (str||'project').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') + '-' + Date.now().toString(36);
}

/* ---------- init ---------- */
function renderAll(){
  renderRecent();
  renderProgress();
  renderHero();
  renderGrid();
}

setAdminUI();
loadProjects();

requestAnimationFrame(()=>{ setTimeout(()=>document.body.classList.add('loaded'), 60); });
</script>
</body>
</html>
